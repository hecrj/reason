[package]
name = "reason"
version = "0.2.0-dev"
edition = "2024"
description = "A library for integrating LLMs in your Rust applications"
license = "MIT"

[features]
default = ["techne"]
techne = ["dep:techne-mcp"]

[dependencies]
futures-util = "0.3"
log = "0.4"
serde_json = "1"
sipper = "0.1"
skema = "0.1"
thiserror = "2"
url = "2.5"

reqwest.version = "0.12"
reqwest.features = ["json"]

serde.version = "1"
serde.features = ["derive"]

tokio.version = "1.46"
tokio.features = ["fs", "process"]

tokio-stream.version = "0.1"
tokio-stream.features = ["io-util"]

techne-mcp.version = "0.1"
techne-mcp.optional = true

[dev-dependencies]
anyhow = "1"
llama-server = "0.2.0-dev"

tokio.version = "1.46"
tokio.features = ["rt", "rt-multi-thread", "macros"]

techne.version = "0.1"
techne.features = ["client", "server", "http"]

[patch.crates-io]
llama-server.git = "https://github.com/hecrj/llama-server.git"
llama-server.rev = "bceaac8d5653853701482a5048db64109fc5685c"
